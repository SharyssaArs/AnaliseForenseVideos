services:
  db:
    image: mysql:8.0
    container_name: forensic-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: forensic_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init_db:/docker-entrypoint-initdb.d
    networks:
      - forensic-net

  redis:
    image: redis:7-alpine
    container_name: forensic-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    networks:
      - forensic-net

volumes:
  mysql_data:

networks:
  forensic-net:
    driver: bridge